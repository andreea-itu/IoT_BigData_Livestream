[project]
name = "livestream-traffic-analytics"
version = "0.1.0"
description = "Extract vehicle counts, direction, and a congestion index from a public YouTube traffic livestream and stream the data into a Big Data pipeline."
authors = [
    { name = "Andreea Itu" },
]
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = { text = "MIT" }
keywords = ["livestream", "opencv", "yolo", "iot", "big-data", "traffic"]

dependencies = [
    "opencv-python (>=4.10.0,<5.0.0)",
    "yt-dlp (>=2024.10.7)",
    "tensorflow (>=2.16.0,<3.0.0)",
    "tensorflow-hub (>=0.16.1,<1.0.0)",
    "supervision (>=0.25.1,<1.0.0)",
    "numpy (>=1.26.4,<2.0.0)",
    "pandas (>=2.2.3,<3.0.0)",
    "streamlit (>=1.40.1,<2.0.0)",
    "pyyaml (>=6.0.2,<7.0.0)",
    "apscheduler (>=3.10.4,<4.0.0)",
    "plotly (>=5.24.1,<6.0.0)",
]

[project.urls]
Homepage = "https://github.com/your-user/livestream-traffic-analytics"

[tool.poetry]
package-mode = false

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.0"
ruff = "^0.7.0"

[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"
